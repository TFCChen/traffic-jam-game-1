name: Game checks

on:
  push:
    branches: [main, feature/game-feel]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/browser-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-evidence
          path: .browser-checks/ci/
          include-hidden-files: true
          retention-days: 7
